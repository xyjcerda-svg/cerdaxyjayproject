<!DOCTYPE html>
<html>
<head>
    <title>Simple Snake Game by XYJ</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #222;
            color: white;
        }

        canvas {
            background: black;
            border: 3px solid white;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Snake Game by XYJ</h1>
    <h2>Score: <span id="score">0</span></h2>

    <canvas id="game" width="300" height="300"></canvas>
    <br>
    <button onclick="restart()">Restart</button>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const size = 15;
        let snake = [{x: 150, y: 150}];
        let food = {x: 75, y: 75};
        let dx = size;
        let dy = 0;
        let score = 0;
        let gameOver = false;

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, 300, 300);

            // Draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, size, size);

            // Draw snake
            ctx.fillStyle = "lime";
            snake.forEach(part => {
                ctx.fillRect(part.x, part.y, size, size);
            });
        }

        function update() {
            if (gameOver) return;

            let head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            // Check walls
            if (head.x < 0 || head.x >= 300 ||
                head.y < 0 || head.y >= 300) {
                endGame();
                return;
            }

            // Check self collision
            if (snake.some(part =>
                part.x === head.x && part.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // Eat food
            if (head.x === food.x && head.y === food.y) {
                score += 1;
                document.getElementById("score").textContent = score;
                food = {
                    x: Math.floor(Math.random() * 20) * size,
                    y: Math.floor(Math.random() * 20) * size
                };
            } else {
                snake.pop();
            }

            draw();
        }

        function endGame() {
            gameOver = true;
            alert("Game Over! Score: " + score);
        }

        function restart() {
            snake = [{x: 150, y: 150}];
            food = {x: 75, y: 75};
            dx = size;
            dy = 0;
            score = 0;
            gameOver = false;
            document.getElementById("score").textContent = score;
            draw();
        }

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowUp" && dy === 0) {
                dx = 0; dy = -size;
            }
            if (e.key === "ArrowDown" && dy === 0) {
                dx = 0; dy = size;
            }
            if (e.key === "ArrowLeft" && dx === 0) {
                dx = -size; dy = 0;
            }
            if (e.key === "ArrowRight" && dx === 0) {
                dx = size; dy = 0;
            }
        });

        draw();
        setInterval(update, 150);
    </script>

</body>
</html>
